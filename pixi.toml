[workspace]
authors = ["Sierra Arn"]
channels = ["conda-forge"]
name = "chess-journey"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

# Environment setup
copy-env = { cmd = "cp .env.example .env" }

# Legacy code setup
setup-legacy-images = { cmd = "python src/legacy/setup_legacy_images.py" }
clean-legacy-images = { cmd = "python src/legacy/setup_legacy_images.py clean" }
launch-legacy-code = { cmd = "cd src/legacy/legacy_code && python -m ChessMain" }

# Chess game setup
launch-chess-game = { cmd = "python -m src.chess_game.main" }

[dependencies]
python = ">=3.12.11,<3.13"
chess = ">=1.11.2,<2"
pydantic-settings = ">=2.10.1,<3"

[pypi-dependencies]
pygame-ce = ">=2.5.5, <3"
pygame-gui = ">=0.6.14, <0.7"